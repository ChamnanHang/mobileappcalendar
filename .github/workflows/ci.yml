name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Google test ad IDs stay confined to ads.dart
        # They are the documented --dart-define fallbacks in lib/data/ads.dart
        # and belong there. Anywhere else in lib/ means one has been pasted in
        # place of the dart-define, which would ship test ads to real users.
        # The safety properties themselves (ads off by default, test units
        # detected) are asserted in test/ads_config_test.dart.
        run: |
          if grep -rn --exclude=ads.dart "ca-app-pub-3940256099942544" lib/ ; then
            echo "::error::Google test ad unit IDs found outside lib/data/ads.dart."
            exit 1
          fi
      - name: Run tests
        # Includes the differential suite that checks the Khmer calendar
        # against 5,706 dates from the Python reference.
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # Installable on an emulator or a phone straight away:
      #   adb install -r app-debug.apk
      # or drag the file onto a running emulator window.
      - name: Build debug APK
        run: flutter build apk --debug

      # This is the build that actually runs R8, resource shrinking and
      # proguard-rules.pro — the earlier `appbundle --debug` did not, because
      # minify and shrinking are configured only on the release buildType. A
      # missing keep rule for the ads SDK shows up here and nowhere else.
      #
      # Without android/key.properties this falls back to the debug signing
      # key (see android/app/build.gradle.kts). Play rejects that, but an
      # emulator installs it happily, which is what these artifacts are for.
      - name: Build release APK (runs R8 + resource shrinking)
        run: flutter build apk --release

      # The shape Play actually takes.
      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Report artifact sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk
          ls -lh build/app/outputs/bundle/release/*.aab

      # Downloadable from the run's summary page, so the app can be installed
      # without a local Android SDK.
      - name: Upload APKs and bundle
        uses: actions/upload-artifact@v4
        with:
          name: noted-android
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  build-ios:
    # iOS builds need macOS and Xcode; there is no cross-compiling from Linux.
    # macOS runner minutes are free on public repositories.
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # No signing identity is available on a runner, and the simulator does
      # not need one. This still compiles the Dart, resolves the CocoaPods
      # dependencies and links the whole app, which is everything short of
      # code signing.
      - name: Build for the iOS simulator
        run: flutter build ios --simulator --no-codesign

      # The privacy manifest has to be *inside* the built app, not merely
      # present in the repo. It sat on disk but outside the Xcode target for a
      # while, so it was never bundled — Apple rejects an AdMob app on exactly
      # that. Only a real build can tell the difference.
      - name: Verify the privacy manifest is bundled
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy is missing from $APP — it is"
            echo "::error::probably not in Copy Bundle Resources in the Xcode target."
            exit 1
          fi
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "PrivacyInfo.xcprivacy is bundled and well-formed."

      # Guards the export-compliance answer and the system-following launch
      # screen, which only take effect once they are compiled into the bundle.
      - name: Verify Info.plist keys survived the build
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          PLIST=$APP/Info.plist
          enc=$(plutil -extract ITSAppUsesNonExemptEncryption raw "$PLIST")
          echo "ITSAppUsesNonExemptEncryption=$enc"
          [ "$enc" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption is not false"; exit 1; }
          # The app follows the system light/dark setting; pinning a style here
          # would make the launch screen disagree with the first Flutter frame.
          if plutil -extract UIUserInterfaceStyle raw "$PLIST" >/dev/null 2>&1; then
            echo "::error::UIUserInterfaceStyle is set; the app follows the system theme"; exit 1
          fi
          # The launch storyboard's background is this named colour.
          # Captured first: grep -q exiting early would SIGPIPE assetutil and
          # trip pipefail even when the colour is there.
          assets=$(xcrun assetutil --info "$APP/Assets.car")
          grep -q '"LaunchBackground"' <<<"$assets" \
            || { echo "::error::LaunchBackground colour missing from Assets.car"; exit 1; }

      - name: Package the simulator app
        run: |
          cd build/ios/iphonesimulator
          zip -qry Runner-simulator.zip Runner.app
          ls -lh Runner-simulator.zip

      # Install on a booted simulator with:
      #   unzip Runner-simulator.zip
      #   xcrun simctl install booted Runner.app
      #   xcrun simctl launch booted com.khmercalendar.noted
      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: noted-ios-simulator
          path: build/ios/iphonesimulator/Runner-simulator.zip
          if-no-files-found: error
          retention-days: 14
